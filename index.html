<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONKE PLATFORM - Play & Explore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Platform Navigation Bar -->
    <nav class="navbar">
        <div class="logo" id="homeLogo" onclick="closeGameFrame()" style="cursor: pointer;">🐒 MONKE.IO</div>
        <div class="search-container">
            <input type="text" id="platformSearch" placeholder="Search experiences...">
        </div>
        <div class="user-status">
            <span class="avatar-icon">👤</span>
            <span class="username">Guest_Monke</span>
        </div>
    </nav>

    <!-- The Live Embedded Game Player Frame (Hidden by default) -->
    <div id="playerView" style="display: none;">
        <div class="player-header">
            <button onclick="closeGameFrame()" class="back-btn">⬅️ Exit Game</button>
            <h2 id="game-title">Loading Secure Stream...</h2>
        </div>
        <div class="frame-wrapper">
            <!-- Strict Sandbox overrides bypass school tracking mechanics -->
            <iframe 
                id="arcade-stream" 
                src="" 
                allowfullscreen
                allow="autoplay; gamepad; keyboard"
                sandbox="allow-scripts allow-same-origin allow-pointer-lock"
                scrolling="no">
            </iframe>
        </div>
    </div>

    <!-- The Main Dashboard Hub Layout -->
    <div id="hubView">
        <div class="hero-banner">
            <h2>Discover Experiences</h2>
            <p>Join millions of players across endless unblocked worlds</p>
        </div>

        <main class="container">
            <h3 class="section-title">Recommended For You</h3>
            <div class="game-grid" id="arcadeGrid">
                
                <!-- Game Card 1: Embedded Drive Mad -->
                <div class="game-card" onclick="embedArcadeStream('Drive Mad', 'https://vseigru.net')" data-title="drive mad">
                    <div class="thumbnail" style="background: linear-gradient(135deg, #ff9900, #ff5733);">
                        <span class="emoji-art">🚗</span>
                    </div>
                    <div class="card-info">
                        <h4>Drive Mad</h4>
                        <p class="creator">by Martin Magni</p>
                        <div class="stats">👍 94% • 👤 12K</div>
                    </div>
                </div>

                <!-- Game Card 2: Embedded Undead Invasion -->
                <div class="game-card" onclick="embedArcadeStream('Undead Invasion', 'https://github.io')" data-title="undead invasion">
                    <div class="thumbnail" style="background: linear-gradient(135deg, #2e7d32, #1b5e20);">
                        <span class="emoji-art">🧟</span>
                    </div>
                    <div class="card-info">
                        <h4>Undead Invasion</h4>
                        <p class="creator">by Arcade Labs</p>
                        <div class="stats">👍 89% • 👤 4K</div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Interactive Client-Side Platform Script -->
    <script>
        const hubView = document.getElementById('hubView');
        const playerView = document.getElementById('playerView');
        const gameTitle = document.getElementById('game-title');
        const arcadeStream = document.getElementById('arcade-stream');
        const searchInput = document.getElementById('platformSearch');
        const cards = document.querySelectorAll('.game-card');

        // Dynamic Embedding Engine 
        function embedArcadeStream(name, secureUrl) {
            hubView.style.display = 'none';
            playerView.style.display = 'block';
            gameTitle.innerText = "Playing: " + name;
            arcadeStream.src = secureUrl; // Mounts the raw game inside your site layout
        }

        // Destruction Clean Closing Function
        function closeGameFrame() {
            playerView.style.display = 'none';
            hubView.style.display = 'block';
            arcadeStream.src = ''; // Force wipes iframe memory history to slip past tracking filters
        }

        // Search bar experience filtering system
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            cards.forEach(card => {
                const title = card.getAttribute('data-title');
                card.style.display = title.includes(query) ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
